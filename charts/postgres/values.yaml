# PostgreSQL for a lab: one replica, one persistent volume. Not a production database operator.
image:
  repository: postgres
  tag: "18.6-alpine"
  pullPolicy: IfNotPresent

auth:
  database: bookshop
  username: bookshop
  # Name of an existing Secret with the key below. Empty = "<release name>-db" (the parent chart creates it).
  existingSecret: ""
  passwordKey: DB_PASSWORD

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""             # empty = the cluster's default StorageClass

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: "1"
    memory: 512Mi
