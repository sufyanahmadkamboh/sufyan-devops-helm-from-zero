# "helm test <release>": every enabled service answers /health, the APIs reach the database (/ready),
# and the frontend serves the configured environment.
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-services
  labels:
    {{- include "bookshop.labels" (dict "root" $ "name" "test") | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: busybox:1.37
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      command: ["sh", "-c"]
      args:
        - |
          set -e   # stop at the first failing check: the Pod fails, and so does "helm test"
          {{- range $name, $svc := .Values.services }}
          {{- if $svc.enabled }}
          out=$(wget -qO- http://{{ $.Release.Name }}-{{ $name }}:{{ $svc.port }}{{ $svc.probes.readiness }})
          echo "{{ $name }}: $out"
          {{- end }}
          {{- end }}
          {{- if .Values.services.frontend.enabled }}
          wget -qO- http://{{ .Release.Name }}-frontend:{{ .Values.services.frontend.port }}/config.js | grep -q 'APP_ENV: "{{ .Values.environment }}"'
          echo "frontend environment: {{ .Values.environment }}"
          {{- end }}
          echo "all checks passed"
