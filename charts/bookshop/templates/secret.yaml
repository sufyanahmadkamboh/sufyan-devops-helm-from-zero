{{- /*
The database password. No password is ever written in a values file:
  - database.existingSecret set: the chart creates nothing and uses that Secret (production: created by an
    administrator or an external secret manager).
  - otherwise: a random password on the FIRST install. On upgrades, "lookup" reads the existing Secret from the
    cluster and keeps its value, so the password does not change under a running database.
"lookup" needs a cluster: with "helm template" it returns nothing, so the rendered value is a fresh random one.
*/ -}}
{{- if not .Values.database.existingSecret }}
{{- $name := include "bookshop.dbSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "bookshop.labels" (dict "root" $ "name" "db") | nindent 4 }}
  annotations:
    # The database volume outlives "helm uninstall" (StatefulSet volumes are kept), and it only accepts the
    # password it was created with: keep the Secret too, so a reinstall finds the same password.
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- if and $existing $existing.data }}
  DB_PASSWORD: {{ index $existing.data "DB_PASSWORD" }}
  {{- else }}
  DB_PASSWORD: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
{{- end }}
