# Bookshop, environment: dev. Deployed WITHOUT Helm: kubectl apply -f environments/dev/
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: bookshop-dev
  labels: { app: frontend, app.kubernetes.io/part-of: bookshop }
spec:
  type: ClusterIP
  selector: { app: frontend }                # traffic goes to the Ready Pods with this label
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: node-api
  namespace: bookshop-dev
  labels: { app: node-api, app.kubernetes.io/part-of: bookshop }
spec:
  type: ClusterIP
  selector: { app: node-api }                # traffic goes to the Ready Pods with this label
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: python-api
  namespace: bookshop-dev
  labels: { app: python-api, app.kubernetes.io/part-of: bookshop }
spec:
  type: ClusterIP
  selector: { app: python-api }                # traffic goes to the Ready Pods with this label
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: go-status
  namespace: bookshop-dev
  labels: { app: go-status, app.kubernetes.io/part-of: bookshop }
spec:
  type: ClusterIP
  selector: { app: go-status }                # traffic goes to the Ready Pods with this label
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: java-api
  namespace: bookshop-dev
  labels: { app: java-api, app.kubernetes.io/part-of: bookshop }
spec:
  type: ClusterIP
  selector: { app: java-api }                # traffic goes to the Ready Pods with this label
  ports:
    - name: http
      port: 8080
      targetPort: http
