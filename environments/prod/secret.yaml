# Bookshop, environment: prod. Deployed WITHOUT Helm: kubectl apply -f environments/prod/
# ⚠️ An EXAMPLE password in a file, so this folder can be applied as-is. This is exactly the problem: a Secret in a
# YAML file in Git is readable by everyone who can read the repository (base64 is not encryption). See docs/09.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: bookshop-prod
type: Opaque
stringData:
  DB_PASSWORD: example-only-prod-password
