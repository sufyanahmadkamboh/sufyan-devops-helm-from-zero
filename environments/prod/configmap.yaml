# Bookshop, environment: prod. Deployed WITHOUT Helm: kubectl apply -f environments/prod/
apiVersion: v1
kind: ConfigMap
metadata:
  name: bookshop-config
  namespace: bookshop-prod
  labels:
    app.kubernetes.io/part-of: bookshop
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: bookshop
  DB_USER: bookshop
  STATS_URL: http://python-api:8000/api/stats
  STATUS_URL: http://go-status:8080/api/status
  ADMIN_URL: ""
  TARGETS: >-
    frontend=http://frontend:8080/health,node-api=http://node-api:3000/health,python-api=http://python-api:8000/health,go-status=http://go-status:8080/health,java-api=http://java-api:8080/health
