apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-api
  namespace: bookshop-prod
  labels: { app: java-api, app.kubernetes.io/part-of: bookshop }
spec:
  replicas: 3
  selector:
    matchLabels: { app: java-api }            # must match the Pod labels below, and the Service's selector
  template:
    metadata:
      labels: { app: java-api, app.kubernetes.io/part-of: bookshop }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: java-api
          image: ghcr.io/sufyanahmadkamboh/bookshop-java-api:1.0.0                # a versioned tag, never "latest"
          imagePullPolicy: IfNotPresent      # pulled from the registry once per node
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: bookshop-config, key: DB_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: bookshop-config, key: DB_PORT } }
            - name: DB_NAME
